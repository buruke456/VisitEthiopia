<!DOCTYPE html>
<html>
<head>
    <title>My Links</title>
    <style>
     a:link {
            color: green;
        }

        a:visited {
            color: purple;
        }

        a:hover {
            color:black;
        }

        a:focus {
            outline: 2px solid blue;
        }

        a:active {
            color: red;
        }
    </style>
</head>

<body>
    <a href="https://www.google.com">Open Google</a>
</body>
</html>
