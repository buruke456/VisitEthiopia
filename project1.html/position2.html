<!DOCTYPE html>
<html>
  <head>
    <style>
    body{
    background-color:#d3d3d3;
    }
    .text1{
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 0;
    
    }
    .text2{
    font-size: 18px;
    width:250px;
    margin-top: 0;
   
    }
    .content{
    box-sizing: border-box;
    border:3px solid black;
    width:320px;
    background-color: white;
    padding:13px;
    position:relative;
    }
    .button{
    background-color: red;
    color:white;
    border-radius: 5px;
    border: none;
    padding:5px 7px;
    position:absolute;
    }
    </style>
  </head>
  <body>
    <div class="content">
      
    <div class="button">New</div>
    <p class="text1">Product Card</p>
    <p class="text2">This is a simple example of position relative and absolute.</p>
    </div>
  
   
  </body>
</html>
